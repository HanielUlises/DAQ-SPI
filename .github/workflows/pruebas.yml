name: Pruebas del protocolo

on:
  push:
    paths:
      - 'protocolo/**'
      - 'herramientas/**'
      - '.github/workflows/pruebas.yml'
  pull_request:
    paths:
      - 'protocolo/**'
      - 'herramientas/**'
      - '.github/workflows/pruebas.yml'

jobs:
  protocolo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y ejecutar
        run: make -C protocolo prueba CC=${{ matrix.cc }}

  herramientas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y libftdi1-dev libglfw3-dev libgl-dev
      - name: prueba_enlace
        run: make -C herramientas/prueba_enlace CXX=${{ matrix.cxx }}
      - name: visor_enlace
        run: make -C herramientas/visor_enlace CXX=${{ matrix.cxx }}
      - name: Pruebas de bits.h (sin hardware)
        run: make -C herramientas/visor_enlace prueba CXX=${{ matrix.cxx }}
